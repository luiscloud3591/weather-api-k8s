# Example only: the real Secret is NOT committed to Git.
# This file lives in k8s/templates/, so `kubectl apply -f k8s/` does not apply it.
#
# Create the real Secret directly in the cluster instead:
#   kubectl -n weather-api create secret generic weather-api-secret \
#     --from-literal=Api__Key=<your-key>
apiVersion: v1
kind: Secret
metadata:
  name: weather-api-secret
  namespace: weather-api
type: Opaque
stringData:
  Api__Key: "<your-key>"
