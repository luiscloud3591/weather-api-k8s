apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: weather-api
  namespace: weather-api
  labels:
    app: weather-api
spec:
  # NGINX ingress controller from the minikube "ingress" addon (KAN-11)
  ingressClassName: nginx
  rules:
    - host: weather-api.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: weather-api
                port:
                  name: http
