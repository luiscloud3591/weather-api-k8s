apiVersion: apps/v1
kind: Deployment
metadata:
  name: weather-api
  namespace: weather-api
  labels:
    app: weather-api
spec:
  # replicas is intentionally not set: the HorizontalPodAutoscaler (k8s/hpa.yaml)
  # owns the replica count (min 2, max 5). Setting it here would reset the
  # count on every `kubectl apply` and fight the HPA during load (KAN-13).
  selector:
    matchLabels:
      app: weather-api
  template:
    metadata:
      labels:
        app: weather-api
    spec:
      containers:
        - name: weather-api
          # Image built and pushed by the CI pipeline (KAN-7), pinned to the commit SHA
          image: ghcr.io/luiscloud3591/weather-api-k8s:da13330512b9db9fe6720c60327900b2f0febbe3
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          # KAN-9: configuration from the ConfigMap, sensitive values from the Secret
          envFrom:
            - configMapRef:
                name: weather-api-config
            - secretRef:
                name: weather-api-secret
          # KAN-12: requests reserve capacity for scheduling (and are the base for the
          # HPA CPU percentage); limits cap what one pod can consume.
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          # KAN-10: Kubernetes restarts the container if liveness fails,
          # and only sends traffic to it while readiness succeeds.
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 3
